<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glue or Wedge?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Sinhala:wght@600&family=Noto+Sans+Tamil:wght@600&display=swap">
<style>
/* Layout: a locked 1920x1080 "map room" console. Top rail = mission tracker, middle = working surface, bottom rail = navigation. */
:root{
  --bg:#D5DEE3;          /* letterbox + map-room wall */
  --paper:#EEF3F5;       /* stage surface */
  --card:#FFFFFF;
  --ink:#13232E;
  --muted:#566977;
  --line:#BFCCD4;
  --accent:#1D5E8C;      /* survey blue */
  --accent-ink:#FFFFFF;
  --glue:#D99A12;        /* honey / resin */
  --glue-soft:#F7E6BC;
  --wedge:#CF3528;       /* fracture red */
  --wedge-soft:#F6D3CE;
  --ok:#2E8A57;
  --ok-soft:#D4EEDD;
  --tile:#DCE5EA;
  --font-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font-body:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081016; --paper:#0F1C25; --card:#162733; --ink:#E5EEF2; --muted:#93A7B4; --line:#2B4050;
    --accent:#5FA9DB; --accent-ink:#06121A; --glue:#F2B53A; --glue-soft:#3A2E12; --wedge:#FF5E50; --wedge-soft:#3D1A17;
    --ok:#5CC98A; --ok-soft:#14321F; --tile:#1D303C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081016; --paper:#0F1C25; --card:#162733; --ink:#E5EEF2; --muted:#93A7B4; --line:#2B4050;
  --accent:#5FA9DB; --accent-ink:#06121A; --glue:#F2B53A; --glue-soft:#3A2E12; --wedge:#FF5E50; --wedge-soft:#3D1A17;
  --ok:#5CC98A; --ok-soft:#14321F; --tile:#1D303C; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden}
#viewport{position:fixed;inset:0;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);display:grid;grid-template-rows:92px 1fr 104px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* top rail */
#top{display:flex;align-items:center;gap:32px;padding:0 48px;border-bottom:2px solid var(--line);background:var(--card)}
.brand{font-family:var(--font-display);font-weight:800;font-size:44px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.brand .g{color:var(--glue)} .brand .w{color:var(--wedge)} .brand .or{color:var(--muted);font-weight:600;font-size:30px;margin:0 6px}
.track{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;min-width:0}
.tk{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tk .lbl{font-family:var(--font-mono);font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tk .bar{height:8px;border-radius:4px;background:var(--line);width:100%}
.tk.done .bar{background:var(--ok)} .tk.now .bar{background:var(--accent)} .tk.now .lbl{color:var(--ink);font-weight:700}
.team{font-family:var(--font-mono);font-size:16px;color:var(--muted);text-align:right;white-space:nowrap}
.team b{color:var(--ink);font-weight:700;display:block;font-size:18px}

/* bottom rail */
#bottom{display:flex;align-items:center;gap:24px;padding:0 48px;border-top:2px solid var(--line);background:var(--card)}
.navbtn{font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:1px;text-transform:uppercase;padding:14px 40px;border-radius:10px;border:3px solid var(--ink);background:transparent;color:var(--ink)}
.navbtn.primary{background:var(--ink);color:var(--paper)}
.navbtn[disabled]{opacity:.35;cursor:not-allowed}
.hint{flex:1;font-size:22px;color:var(--muted);text-align:center}
.hint b{color:var(--ink)}

/* main */
#main{position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;inset:0;padding:40px 56px;display:grid;gap:40px;min-height:0}
.eyebrow{font-family:var(--font-mono);font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}
h1,h2,h3{margin:0;text-wrap:balance}
.h-xl{font-family:var(--font-display);font-weight:800;font-size:150px;line-height:.88;letter-spacing:-1px}
.h-l{font-family:var(--font-display);font-weight:800;font-size:72px;line-height:.95}
.h-m{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1}
.h-s{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05}
p{margin:0}
.body{font-size:25px;line-height:1.5}
.small{font-size:19px;line-height:1.45;color:var(--muted)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:28px 32px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:2px solid currentColor}
.chip.glue{color:var(--glue)} .chip.wedge{color:var(--wedge)}

/* title */
.title-grid{grid-template-columns:1.15fr 1fr;align-items:center}
.pairs{display:grid;gap:18px}
.pair{display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;text-align:left;padding:22px 26px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.pair .lt{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:1;color:var(--muted)}
.pair .nm{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1}
.pair .q{font-size:19px;color:var(--muted);margin-top:6px}
.pair[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.pair[aria-pressed="true"] .lt{color:var(--accent)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;font-family:var(--font-mono);font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;font-size:24px;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{resize:none;line-height:1.45}
.linkbtn{background:none;border:0;color:var(--muted);font-family:var(--font-mono);font-size:16px;text-decoration:underline;padding:4px}

.title-hero{background:#5F7F96 url("img/hero_title.webp") center/cover no-repeat;padding:44px 64px;color:#F6F3EC}
.tcol{width:1060px;display:grid;gap:22px;align-content:center;text-shadow:0 2px 10px rgba(20,35,46,.35)}
.tpanel{background:var(--card);color:var(--ink);border-radius:16px;padding:22px 26px;display:grid;gap:14px;text-shadow:none;box-shadow:0 14px 40px rgba(10,20,30,.25)}
.tpanel .pairs{grid-template-columns:repeat(3,1fr);gap:12px}
.tpanel .pair{grid-template-columns:44px 1fr;gap:12px;padding:14px 16px}
.tpanel .pair .lt{font-size:46px} .tpanel .pair .nm{font-size:28px} .tpanel .pair .q{font-size:16px}
.hdr{width:100%;aspect-ratio:1376/768;object-fit:cover;border-radius:16px;border:2px solid var(--line);display:block;max-width:100%}
.cimg{filter:drop-shadow(0 8px 10px rgba(0,0,0,.22));transition:filter .15s}
.hot:hover .cimg,.hot.sel .cimg{filter:drop-shadow(0 8px 10px rgba(0,0,0,.22)) brightness(1.06) drop-shadow(0 0 10px rgba(255,255,255,.9))}
/* brief */
.brief-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr auto;align-content:start}
.concept{display:grid;grid-template-rows:auto auto 1fr;gap:14px}
.concept svg{width:100%;height:150px}
.steps4{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.st{display:flex;gap:16px;align-items:flex-start}
.st .n{font-family:var(--font-display);font-weight:800;font-size:54px;line-height:.9;color:var(--accent)}

/* story */
.story-grid{grid-template-columns:1.35fr 1fr}
.story p+p{margin-top:16px}
.facts{display:grid;gap:16px;align-content:start}
.fact{display:flex;gap:16px;align-items:baseline;font-size:23px;line-height:1.35;padding:16px 0;border-bottom:2px dashed var(--line)}
.fact .k{font-family:var(--font-mono);font-size:15px;color:var(--accent);font-weight:700;letter-spacing:1px;min-width:44px}
.narr{font-family:var(--font-mono);font-size:16px;color:var(--muted)}

/* map */
.map-grid{grid-template-columns:1.3fr 1fr}
.mapbox{display:grid;grid-template-rows:auto 1fr auto;gap:14px;min-height:0}
.layers{display:flex;gap:10px;flex-wrap:wrap}
.lyr{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.5px;padding:10px 22px;border-radius:10px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.lyr[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lyr.fault[aria-pressed="true"]{background:var(--wedge);border-color:var(--wedge);color:#fff}
.mapsvg{width:100%;height:100%;min-height:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:18px;min-height:56px;align-items:center}
.sw{display:inline-block;width:20px;height:20px;border-radius:4px;vertical-align:-3px;margin-right:8px}
.lnsw{display:inline-block;width:40px;vertical-align:middle;margin-right:8px;border-radius:3px}
.hover{font-family:var(--font-mono);font-size:17px;color:var(--muted);min-height:26px}
.hex{stroke:var(--paper);stroke-width:2}
.coast{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
.ops{display:grid;gap:12px}
.op{text-align:left;font-size:22px;line-height:1.3;padding:16px 20px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);display:flex;gap:14px}
.op .lt{font-family:var(--font-mono);font-weight:700;color:var(--muted)}
.op.sel{border-color:var(--accent)}
.op.right{border-color:var(--ok);background:var(--ok-soft)}
.op.wrong{border-color:var(--wedge);background:var(--wedge-soft)}
.fb{font-size:21px;line-height:1.45;padding:18px 20px;border-radius:12px;background:var(--paper);border-left:6px solid var(--accent)}
.fb.good{border-left-color:var(--ok)} .fb.bad{border-left-color:var(--wedge)}

/* street */
.street-grid{grid-template-columns:1.55fr 1fr}
.scene{border-radius:16px;overflow:hidden;border:2px solid var(--line);min-height:0;align-self:start}
.scene svg{display:block;width:100%;height:auto}
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible .mk circle{stroke:var(--accent);stroke-width:8}
.mk circle{fill:var(--ink);stroke:#fff;stroke-width:5}
.mk text{fill:#fff;font-family:var(--font-display);font-weight:800;font-size:30px}
.hot.sel .mk circle{fill:var(--accent)}
.hot.done .mk circle{fill:var(--ok)}
.pulse{fill:none;stroke:#fff;stroke-width:4;opacity:.8;animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.sg{font-size:21px;font-weight:600;padding:12px 18px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.sg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.objcard{display:grid;gap:18px;align-content:start}
.tagrow{display:grid;gap:10px}
.qlabel{font-family:var(--font-mono);font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.prog{display:flex;gap:8px}
.prog span{width:44px;height:10px;border-radius:5px;background:var(--line)}
.prog span.on{background:var(--ok)}

/* verdict */
.verdict-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
.meter{grid-column:1/-1}
.scale{position:relative;margin-top:18px}
.scale input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:28px;border-radius:14px;background:linear-gradient(90deg,var(--glue),var(--line) 50%,var(--wedge));outline-offset:6px}
.scale input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;border-radius:50%;background:var(--card);border:6px solid var(--ink);cursor:pointer}
.scale input[type=range]::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:var(--card);border:6px solid var(--ink);cursor:pointer}
.ticks{display:grid;grid-template-columns:repeat(5,1fr);margin-top:12px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--muted)}
.ticks span.on{color:var(--ink)}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ev{text-align:left;font-size:20px;line-height:1.3;padding:16px 18px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-height:92px}
.ev[aria-pressed="true"]{border-color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
.nudge{font-size:20px;color:var(--wedge);font-weight:600;min-height:28px}

/* compare */
.compare-grid{grid-template-columns:1fr 1fr 1.05fr}
.cmp{display:grid;grid-template-rows:auto 330px auto;gap:12px}
.cmp svg{width:100%;height:100%}
.rate-pill{font-family:var(--font-display);font-weight:800;font-size:30px}

/* exit + report */
.exit-grid{grid-template-columns:1fr 1fr}
.wc{font-family:var(--font-mono);font-size:15px;color:var(--muted);text-align:right}
.report-grid{grid-template-columns:1.25fr 1fr}
.rtable{width:100%;border-collapse:collapse;font-size:20px}
.rtable th{text-align:left;font-family:var(--font-mono);font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
.memo svg{width:40px;height:40px;flex:none}
.memo{display:flex;gap:12px;align-items:center;font-size:20px;line-height:1.3;padding:10px 14px;border-radius:10px;background:var(--paper);border:2px dashed var(--line)}
.fu{font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--wedge);border:3px solid var(--wedge);border-radius:8px;padding:0 8px;line-height:1.2}
.rtable td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.num{font-variant-numeric:tabular-nums}
.copybox{width:100%;height:330px;font-family:var(--font-mono);font-size:15px}

/* teacher board */
.board-grid{grid-template-columns:1.6fr 1fr}
.brow{display:grid;grid-template-columns:230px repeat(5,1fr) 90px;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--line)}
.brow.head{font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--muted);border-bottom:3px solid var(--ink)}
.brow .cn{font-family:var(--font-display);font-weight:800;font-size:36px}
.cell{height:76px;border-radius:10px;border:2px dashed var(--line);background:transparent;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:6px;color:var(--ink)}
.cell:hover{border-color:var(--accent)}
.dot{width:18px;height:18px;border-radius:50%}
.avg{font-family:var(--font-mono);font-size:22px;font-weight:700;text-align:center}
.confirm{display:flex;gap:10px;align-items:center;font-size:19px}
</style>
</head>
<body>


<div id="viewport"><div id="stage" role="application" aria-label="Glue or Wedge culture lab">
  <header id="top"></header>
  <main id="main"></main>
  <footer id="bottom"></footer>
</div></div>

<script>
/* ============ DATA ============ */
const PAL=["#2F7FC1","#E07B39","#3BA275","#9A5BC2","#C9A227","#D35A7A","#43B5B8","#8A6A4E","#6C7F94","#A9B83E","#5E6AD2","#C2763A","#3E8E8E"];
const LAYERS=[{k:"lang",n:"Language"},{k:"rel",n:"Religion"},{k:"eth",n:"Identity"}];

const C={
belgium:{name:"Belgium",pair:"A",where:"Flanders & Brussels · Europe",narr:"Luc, 16, Leuven (composite character)",
 story:["In Belgium, the language you grow up with decides a lot: your school, your TV channels, even which political parties appear on your ballot. Luc lives in Leuven, in Flanders, the Dutch-speaking north. An hour south, in Wallonia, nearly everyone speaks French.",

 "Forming a national government can take more than a year. Brussels, the officially bilingual capital, sits inside Flanders like an island. What still holds Belgium together? The Red Devils soccer team, the monarchy, and a Catholic heritage that never split along the language line."],

 R:{F:["Flanders","Dutch","Catholic heritage","Flemish"],B:["Brussels","Bilingual (French & Dutch)","Catholic heritage","Mixed, Brussels"],W:["Wallonia","French","Catholic heritage","Walloon"],G:["East Cantons","German","Catholic heritage","German-speaking Belgian"]},
 grid:["  FFFF  "," FFFFFF ","FFFBFFFF"," WWWWWWG","  WWWWWG","   WWW  "],

  why:"The orange fault line is two layers stacking: language and identity. Religion does not add a third layer, which is one reason Belgium's split stays political instead of violent."},
 ev:[["Red Devils fans cheer in both languages","g"],["Shared Catholic heritage across the language line","g"],["Brussels works as a bilingual capital","g"],["541 days with no elected national government (2010–11)","w"],["Separate Dutch and French schools, media, and parties","w"],["Wealthier Flanders resents paying to support Wallonia","w"]]},

switzerland:{name:"Switzerland",pair:"A",where:"Biel/Bienne · Europe",narr:"Noémie, 15, Biel/Bienne (composite character)",
 story:["Switzerland has four national languages: German (spoken by about 62% of people), French (about 23%), Italian (about 8%), and Romansh (under 1%). Noémie lives in Biel/Bienne, a city right on the language border where street signs come in German and French and people switch languages mid-conversation.",

 R:{a:["Geneva & Vaud","French","Protestant","Swiss"],b:["Fribourg, Jura & Lower Valais","French","Catholic","Swiss"],c:["Zurich, Bern & Basel","German","Protestant","Swiss"],d:["Lucerne & central cantons","German","Catholic","Swiss"],i:["Ticino","Italian","Catholic","Swiss"],r:["Surselva (Graubünden)","Romansh","Catholic","Swiss"],s:["Engadine (Graubünden)","Romansh","Protestant","Swiss"]},
 grid:["    cccc dd ","  bbccccddd "," aabbccdddds","aaabbdddd rs"," aa bbddirrr","       ii   "],
 mapQ:{q:"Review each layer one at a time, then check Fault lines. What do the Swiss layers show?",

quebec:{name:"Quebec (Canada)",pair:"B",where:"Montreal · North America",narr:"Lucie, 16, Montreal (composite character)",

function tiles(id){const g=C[id].grid,out=[];g.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch!==" ")out.push({c,r,k:ch})}));return out}
function colorMap(id,layer){const idx={lang:1,rel:2,eth:3}[layer],m={},vals=[];Object.values(C[id].R).forEach(v=>{if(!(v[idx] in m)){m[v[idx]]=PAL[vals.length%PAL.length];vals.push(v[idx])}});return m}
function hexMap(id,mode,W,H,interactive){
 const ts=tiles(id),at={};ts.forEach(t=>at[t.c+","+t.r]=t);
 let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
 ts.forEach(t=>{const x=SQ3*(t.c+.5*(t.r&1)),y=1.5*t.r;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)});
 const bw=maxx-minx+SQ3,bh=maxy-miny+2,pad=16;const sz=Math.min((W-2*pad)/bw,(H-2*pad)/bh);
 const ox=(W-bw*sz)/2-(minx-SQ3/2)*sz,oy=(H-bh*sz)/2-(miny-1)*sz;
 const ctr=t=>[ox+sz*SQ3*(t.c+.5*(t.r&1)),oy+sz*1.5*t.r];
 const cor=(t,i)=>{const[x,y]=ctr(t),a=(60*i-30)*Math.PI/180;return[x+sz*Math.cos(a),y+sz*Math.sin(a)]};
 const R=C[id].R,cm=mode==="fault"?null:colorMap(id,mode),idx={lang:1,rel:2,eth:3};
 let fills="",edges="",coast="",glow="";
 ts.forEach(t=>{const pts=[0,1,2,3,4,5].map(i=>cor(t,i).map(v=>v.toFixed(1)).join(",")).join(" ");
  const v=R[t.k];const fill=mode==="fault"?"var(--tile)":cm[v[idx[mode]]];
  fills+=`<polygon class="hex" points="${pts}" fill="${fill}" data-k="${t.k}"${interactive?` tabindex="-1"`:""}><title>${v[0]}: ${v[1]} · ${v[2]} · ${v[3]}</title></polygon>`;
  for(let d=0;d<6;d++){const[nc,nr]=NB[d](t.c,t.r),n=at[nc+","+nr],a=cor(t,d),b=cor(t,(d+1)%6);
   const seg=`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
   if(!n){coast+=seg;continue}
   if(d>2)continue;
   const u=R[n.k];
   if(mode==="fault"){const cnt=[1,2,3].filter(i=>v[i]!==u[i]).length;
     if(cnt===1)edges+=`<path d="${seg}" stroke="var(--muted)" stroke-width="${Math.max(2,sz*.07)}" stroke-linecap="round"/>`;
     if(cnt===2)edges+=`<path d="${seg}" stroke="#F08A24" stroke-width="${Math.max(5,sz*.2)}" stroke-linecap="round"/>`;
     if(cnt===3){glow+=`<path d="${seg}" stroke="#E0303A" stroke-width="${Math.max(16,sz*.5)}" stroke-linecap="round" opacity=".28"/>`;edges+=`<path d="${seg}" stroke="#E0303A" stroke-width="${Math.max(7,sz*.26)}" stroke-linecap="round"/>`}}
   else if(v[idx[mode]]!==u[idx[mode]])edges+=`<path d="${seg}" stroke="var(--ink)" stroke-width="${Math.max(3,sz*.1)}" stroke-linecap="round"/>`;
  }});
 return `<svg viewBox="0 0 ${W} ${H}" class="mapsvg" role="img" aria-label="${C[id].name} ${mode} map">${fills}<path class="coast" d="${coast}"/>${glow}${edges}</svg>`}
function legendHTML(id,mode){if(mode==="fault")return `<span><span class="lnsw" style="height:4px;background:var(--muted)"></span>1 layer differs</span><span><span class="lnsw" style="height:9px;background:#F08A24"></span>2 layers stack</span><span><span class="lnsw" style="height:13px;background:#E0303A"></span>3 layers stack (fault line)</span>`;
 const cm=colorMap(id,mode);return Object.entries(cm).map(([v,c])=>`<span><span class="sw" style="background:${c}"></span>${v}</span>`).join("")}

function renderTop(st,cur){const groups=[];st.forEach((s,i)=>{if(!s.g)return;let g=groups.find(x=>x.g===s.g);if(!g){g={g:s.g,first:i,last:i};groups.push(g)}g.last=i});

 `<div class="track">${groups.map(g=>`<div class="tk ${S.step>g.last?"done":S.step>=g.first?"now":""}" style="flex:${Math.max(g.last-g.first+1,3)}"><span class="lbl">${g.g}</span><span class="bar"></span></div>`).join("")}</div>`);
 const n=S.names.filter(Boolean).join(" & ");

function renderBottom(st,cur){const g=gate(cur);const last=S.step===st.length-1;
 $("#bottom").innerHTML=`<button class="navbtn" data-act="back" ${S.step===0?"disabled":""}>◀ Back</button><div class="hint">${g.ok?(g.msg||""):`<b>To continue:</b> ${g.msg}`}</div>${last?`<button class="navbtn" data-act="restart">Start over</button>`:`<button class="navbtn primary" data-act="next" ${g.ok?"":"disabled"}>${cur.t==="title"?"Start":"Next"} ▶</button>`}`}
function renderBottomBoard(){$("#bottom").innerHTML=`<button class="navbtn" data-act="leaveboard">◀ Back to lab</button><div class="hint">Click a cell to add a pair's rating. Right-click (or Shift-click) to remove one.</div>${UI.confirmReset?`<div class="confirm">Clear every tally? <button class="navbtn" data-act="resetyes">Clear</button><button class="navbtn" data-act="resetno">Keep</button></div>`:`<button class="navbtn" data-act="resetboard">Clear board</button>`}`}

function wsCode(cur){if(cur.id)return (ALL.indexOf(cur.id)+1)+{story:"A",map:"B",street:"C",verdict:"D"}[cur.t];if(cur.t==="compare")return "M"+(ORDER.indexOf(cur.pair)+1);return ""}
function gate(cur){const cs=cur.id?S.cases[cur.id]:null,w=`<b>Worksheet ${wsCode(cur)}:</b>`;
 switch(cur.t){
 case"title":return{ok:true,msg:"Grab your worksheet, then press Start."};

 case"verdict":return cs.touched&&cs.ev.length>=2?{ok:true,msg:`${w} circle your rating and finish the because sentence.`}:{ok:false,msg:"set your rating and pick 2 or more evidence cards."};
 case"compare":return{ok:true,msg:`${w} write 2 to 3 sentences.`};
 case"exit":return{ok:true,msg:"<b>Worksheet W1 to W3:</b> rank the six countries and answer both FRQ parts."};
 default:return{ok:true,msg:"Show this screen to your teacher, then turn in your worksheet."}}}

function verdictScreen(cur){const c=C[cur.id],cs=S.cases[cur.id];const labels=["Strong glue","Mostly glue","Both","Mostly wedge","Strong wedge"];

function shuffleFor(seed,n){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

  <div class="fb"><b>Write all three answers on your worksheet.</b> You can go back to any case with the Back button to check your evidence.</div></div></section>`}

function reportScreen(){const labels=["Strong glue","Mostly glue","Both","Mostly wedge","Strong wedge"];
 const rows=ALL.map(id=>{const cs=S.cases[id],c=C[id],sc=SCENES[id];const right=sc.objs.filter(o=>{const x=cs.tags[o.id];return x&&x.checked&&o.tags.includes(x.tag)&&x.force===o.force}).length;
  return `<tr><td><b>${c.name}</b></td><td class="num">${c.mapQ.o[cs.mapAns]?.[1]?"✓":"✗"}</td><td class="num">${right}/4</td><td><b style="color:${cs.rating<3?"var(--glue)":cs.rating>3?"var(--wedge)":"var(--muted)"}">${cs.rating} · ${labels[cs.rating-1]}</b></td></tr>`}).join("");
 return `<section class="screen report-grid">
 <div class="panel" style="display:grid;gap:18px;align-content:start;overflow:auto"><span class="eyebrow">Lab summary</span><h1 class="h-l">Case closed.</h1>
  <table class="rtable"><thead><tr><th>Country</th><th>Map</th><th>Clues</th><th>Your verdict</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="panel" style="display:grid;gap:16px;align-content:start"><span class="eyebrow">Before you finish</span>
  <p class="body" style="font-size:23px">Check your worksheet:</p>
  <ol class="body" style="font-size:22px;margin:0;padding-left:30px;display:grid;gap:8px"><li>Cases 1A to 6D are filled in.</li><li>Compare questions M1, M2, and M3 are answered.</li><li>W1 ranking and both FRQ parts (W2, W3) are done.</li></ol>
  <p class="small">Show this screen to your teacher. Your teacher may ask your pair to share your ratings on the class board.</p></div></section>`}

function boardScreen(){const order=["belgium","switzerland","quebec","nireland","srilanka","indonesia"];const labels=["Strong glue","Mostly glue","Both","Mostly wedge","Strong wedge"];
 const cols=["var(--glue)","color-mix(in srgb,var(--glue) 60%,var(--muted))","var(--muted)","color-mix(in srgb,var(--wedge) 60%,var(--muted))","var(--wedge)"];
 return `<section class="screen board-grid"><div class="panel" style="display:grid;align-content:start">
  <div class="brow head"><span>Country</span>${labels.map((l,i)=>`<span style="text-align:center;color:${cols[i]}">${i+1} · ${l}</span>`).join("")}<span style="text-align:center">Avg</span></div>
  ${order.map(id=>{const b=S.board[id],tot=b.reduce((a,x)=>a+x,0),avg=tot?(b.reduce((a,x,i)=>a+x*(i+1),0)/tot).toFixed(1):"–";
   return `<div class="brow"><span class="cn">${C[id].name.replace(" (Canada)","")}</span>${b.map((x,i)=>`<button class="cell" data-act="tally" data-id="${id}" data-v="${i}" aria-label="${C[id].name}, ${labels[i]}: ${x}">${[...Array(x)].map(()=>`<span class="dot" style="background:${cols[i]}"></span>`).join("")}</button>`).join("")}<span class="avg num">${avg}</span></div>`}).join("")}</div>
 <div class="panel" style="display:grid;gap:18px;align-content:start"><span class="eyebrow">Discussion prompts</span>
  ${["Belgium and Switzerland mix the same language families. Why did pairs rate them so differently?","Northern Ireland shares one language. What does its rating say about religion and identity as forces?","Sri Lanka and Indonesia both chose a national language. What made one choice glue and the other a wedge?","Where did pairs disagree most? Make both sides argue it with evidence.","Pick one country: is it glue at one scale but a wedge at another?"].map((q,i)=>`<div class="st"><span class="n" style="font-size:40px">${i+1}</span><p class="body" style="font-size:22px">${q}</p></div>`).join("")}</div></section>`}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b){act(b.dataset.act,b,e);return}
 const h=e.target.closest(".hot");if(h){UI.obj=h.dataset.obj;render()}});
document.addEventListener("contextmenu",e=>{const b=e.target.closest('[data-act="tally"]');if(b){e.preventDefault();const a=S.board[b.dataset.id];const i=+b.dataset.v;if(a[i]>0)a[i]--;render()}});
document.addEventListener("keydown",e=>{const h=e.target.closest&&e.target.closest(".hot");if(h&&(e.key==="Enter"||e.key===" ")){e.preventDefault();UI.obj=h.dataset.obj;render();const n=document.querySelector(`.hot[data-obj="${UI.obj}"]`);n&&n.focus()}});
document.addEventListener("mouseover",e=>{const p=e.target.closest("#mapwrap polygon");if(p){showHov(p)}});
document.addEventListener("pointerdown",e=>{const p=e.target.closest("#mapwrap polygon");if(p)showHov(p)});
function showHov(p){const cur=steps()[S.step];const v=C[cur.id].R[p.dataset.k];const h=$("#hov");if(h)h.innerHTML=`<b style="color:var(--ink)">${v[0]}</b> · Language: ${v[1]} · Religion: ${v[2]} · Identity: ${v[3]}`}
document.addEventListener("input",e=>{const t=e.target,cur=steps()[S.step];
 if(t.id==="n1"||t.id==="n2"){S.names[t.id==="n1"?0:1]=t.value;renderTop(steps(),cur);renderBottom(steps(),cur);save();return}
 if(t.id==="rate"){const cs=S.cases[cur.id];cs.rating=+t.value;cs.touched=true;const pos=t.selectionStart;render();const r=$("#rate");r&&r.focus();return}
 if(t.id==="because"){S.cases[cur.id].because=t.value;renderBottom(steps(),cur);save();return}
 if(t.id==="cmp"){S.compare[cur.pair]=t.value;renderBottom(steps(),cur);save();return}
 if(t.id==="frqA"||t.id==="frqB"){S[t.id]=t.value;const w=t.value.trim()?t.value.trim().split(/\s+/).length:0;$(t.id==="frqA"?"#wcA":"#wcB").textContent=w+" words";renderBottom(steps(),cur);save()}});

function act(a,b,e){const st=steps(),cur=st[S.step],cs=cur&&cur.id?S.cases[cur.id]:null;
 switch(a){
 case"pair":S.pair=b.dataset.v;break;
 case"next":if(gate(cur).ok){S.step++;UI.obj=null;UI.layer="lang";UI.copied=false}break;
 case"back":if(S.step>0){S.step--;UI.obj=null;UI.layer="lang"}break;
 case"layer":UI.layer=b.dataset.v;break;
 case"mapans":if(cs.mapAns===null)cs.mapAns=+b.dataset.v;break;
 case"tag":case"force":{const d=UI.draft[UI.obj]=UI.draft[UI.obj]||{};d[a]=b.dataset.v;break}
 case"check":{const d=UI.draft[UI.obj]||{};if(d.tag&&d.force)cs.tags[UI.obj]={tag:d.tag,force:d.force,checked:true};break}
 case"ev":{const i=+b.dataset.v,k=cs.ev.indexOf(i);k>=0?cs.ev.splice(k,1):cs.ev.push(i);break}
 case"copy":{const txt=reportText();const ta=$("#rep");try{navigator.clipboard.writeText(txt).then(()=>{UI.copied=true;render()},()=>{ta.focus();ta.select()})}catch(err){ta.focus();ta.select()}return}
 case"restart":{const board=S.board;S=fresh();S.board=board;UI={layer:"lang",obj:null,draft:{},confirmReset:false,copied:false};break}
 case"board":S.mode="board";break;
 case"leaveboard":S.mode="student";UI.confirmReset=false;break;
 case"tally":{const arr=S.board[b.dataset.id],i=+b.dataset.v;if(e.shiftKey){if(arr[i]>0)arr[i]--}else arr[i]++;break}
 case"resetboard":UI.confirmReset=true;break;
 case"resetno":UI.confirmReset=false;break;
 case"resetyes":Object.keys(S.board).forEach(k=>S.board[k]=[0,0,0,0,0]);UI.confirmReset=false;break}
 render();
 if(a==="tag"||a==="force"||a==="check"){const n=document.querySelector(`[data-act="${a==="check"?"next":a}"][aria-pressed="true"]`)||document.querySelector('[data-act="next"]');}
}

/* ============ SCALE TO 1920x1080 ============ */
function fit(){const vp=$("#viewport"),cs=getComputedStyle(vp);const W=vp.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=vp.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 const s=Math.min(W/1920,H/1080);const x=parseFloat(cs.paddingLeft)+(W-1920*s)/2,y=parseFloat(cs.paddingTop)+(H-1080*s)/2;$("#stage").style.transform=`translate(${x}px,${y}px) scale(${s})`}
window.addEventListener("resize",fit);fit();render();
</script>
